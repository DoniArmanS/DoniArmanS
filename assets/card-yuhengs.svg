<svg xmlns="http://www.w3.org/2000/svg" width="420" height="190" viewBox="0 0 420 190" role="img" aria-label="Yuhengs: Anime streaming site that pulls episodes from many free servers into one player. Built with Next.js, TypeScript, Tailwind.">
<style>text{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Noto Sans', Helvetica, Arial, sans-serif}.m{font-family:ui-monospace, SFMono-Regular, 'SF Mono', Menlo, Consolas, 'DejaVu Sans Mono', 'Liberation Mono', monospace}@media (prefers-reduced-motion: reduce){*{animation:none!important}}@keyframes pulse{0%{transform:scale(1);opacity:.9}70%,100%{transform:scale(2.6);opacity:0}}.pulse{transform-box:fill-box;transform-origin:center;animation:pulse 1.6s ease-out infinite}</style>
<defs><clipPath id="r"><rect width="420" height="190" rx="14"/></clipPath></defs>
<g clip-path="url(#r)"><rect width="420" height="190" fill="#1a1b27"/><rect width="420" height="4" fill="#9ece6a"/></g>
<rect x="0.5" y="0.5" width="419" height="189" rx="14" fill="none" stroke="#2f334d"/>
<rect x="300.6" y="22" width="95.4" height="22" rx="11" fill="#9ece6a" fill-opacity="0.14" stroke="#9ece6a" stroke-opacity="0.6"/><circle class="pulse" cx="314.6" cy="33" r="3" fill="#9ece6a"/><circle cx="314.6" cy="33" r="3" fill="#9ece6a"/><text class="m" x="325.6" y="37" fill="#9ece6a" style="font-size:11px;font-weight:700;letter-spacing:0">LIVE DEMO</text><text x="24" y="42" fill="#c0caf5" style="font-size:20px;font-weight:700">Yuhengs</text><text x="24" y="80" fill="#a9b1d6" style="font-size:14px">Anime streaming site that pulls episodes</text><text x="24" y="102" fill="#a9b1d6" style="font-size:14px">from many free servers into one player.</text><rect x="24.0" y="136" width="70.4" height="26" rx="13" fill="#24283b"/><text class="m" x="59.2" y="153" text-anchor="middle" fill="#9ece6a" style="font-size:12px">Next.js</text><rect x="102.4" y="136" width="92.0" height="26" rx="13" fill="#24283b"/><text class="m" x="148.4" y="153" text-anchor="middle" fill="#9ece6a" style="font-size:12px">TypeScript</text><rect x="202.4" y="136" width="77.6" height="26" rx="13" fill="#24283b"/><text class="m" x="241.2" y="153" text-anchor="middle" fill="#9ece6a" style="font-size:12px">Tailwind</text>
</svg>
